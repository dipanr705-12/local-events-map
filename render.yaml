services:
  - type: web
    name: local-events-map
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm run start:server
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/events.db
